import { describe, it, expect } from 'vitest';

describe('Pipeline de pruebas VACLINIC', () => {
  it('ejecuta pruebas correctamente', () => {
    expect(1 + 1).toBe(2);
  });

  it('el entorno jsdom esta disponible', () => {
    const div = document.createElement('div');
    div.textContent = 'VACLINIC';
    expect(div.textContent).toBe('VACLINIC');
  });
});
